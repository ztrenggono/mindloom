server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Whiteboard images travel inside sync messages as data URLs.
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Live collaboration: a long-lived WebSocket. The server pings every 30 s, well inside the timeout.
  location = /api/collab {
    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://backend:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets never change, so browsers can keep them.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths load index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
