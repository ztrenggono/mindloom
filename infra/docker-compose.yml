# Runs the whole Mindloom stack: `cd infra && docker compose up -d --build`, then open http://localhost:8080
# Settings come from .env next to this file (see .env.example); every one has a default.

name: mindloom

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindloom}
      POSTGRES_DB: ${POSTGRES_DB:-mindloom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mindloom}:${POSTGRES_PASSWORD:-mindloom}@db:5432/${POSTGRES_DB:-mindloom}
      PORT: 8787
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8787/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      # With HTTPS on, set WEB_PORT=127.0.0.1:8080 so plain HTTP is only reachable from this machine.
      - '${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

  # HTTPS (optional): starts only with COMPOSE_PROFILES=https. Settings are in Caddyfile.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS: ${TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and Caddy's internal certificate authority; keep this volume.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
