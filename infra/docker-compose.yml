# Runs the whole Mindloom stack: `cd infra && docker compose up -d --build`, then open http://localhost:8080
# Settings come from .env next to this file (see .env.example); every one has a default.

name: mindloom

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindloom}
      POSTGRES_DB: ${POSTGRES_DB:-mindloom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mindloom}:${POSTGRES_PASSWORD:-mindloom}@db:5432/${POSTGRES_DB:-mindloom}
      PORT: 8787
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8787/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
