# Runs the whole Inkvault stack: `docker compose up -d`, then open http://localhost:8080
# Settings come from .env next to this file (see .env.example); every one has a default.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkvault}
      POSTGRES_DB: ${POSTGRES_DB:-inkvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inkvault}:${POSTGRES_PASSWORD:-inkvault}@db:5432/${POSTGRES_DB:-inkvault}
      PORT: 8787
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8787/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./inkvault
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
